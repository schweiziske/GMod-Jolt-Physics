name: Linux dedicated server builds

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    # Fork and Dependabot PRs do not receive the SDK deploy key.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: gmod-public-linux-x86
            steam_branch: public
            bin: bin
            wrapper: vphysics_srv.so
            lua_suffix: linux
            elf_class: ELF32
            package: GMod-Jolt-Physics-Public-Linux-x86
          - target: gmod-beta-linux-x86-64
            steam_branch: x86-64
            bin: bin/linux64
            wrapper: vphysics.so
            lua_suffix: linux64
            elf_class: ELF64
            package: GMod-Jolt-Physics-Beta-Linux-x86-64
    steps:
      - name: Checkout source and pinned Jolt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Checkout pinned Source/GMod SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: schweiziske/gmod-project-sdk
          ssh-key: ${{ secrets.SDK_DEPLOY_KEY }}
          ref: e3910f8106c77f356114e12c9ca7d6592489e1ef
          path: .cache/deps/sdk
          persist-credentials: false
      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-12-multilib ninja-build lib32gcc-s1
      - name: Download matching dedicated server
        shell: bash
        env:
          STEAM_BRANCH: ${{ matrix.steam_branch }}
        run: |
          steamcmd="$RUNNER_TEMP/steamcmd"
          mkdir -p "$steamcmd"
          curl -fsSL --retry 3 https://media.steampowered.com/installer/steamcmd_linux.tar.gz -o "$steamcmd/steamcmd.tar.gz"
          tar -xzf "$steamcmd/steamcmd.tar.gz" -C "$steamcmd"
          branch_args=()
          if [[ "$STEAM_BRANCH" != public ]]; then
            branch_args=(-beta "$STEAM_BRANCH")
          fi
          "$steamcmd/steamcmd.sh" +@ShutdownOnFailedCommand 1 +force_install_dir "$RUNNER_TEMP/gmod" \
            +login anonymous +app_update 4020 "${branch_args[@]}" +quit
      - name: Build and package Linux binaries
        shell: bash
        env:
          CXX: g++-12
          TARGET_BIN: ${{ matrix.bin }}
          WRAPPER: ${{ matrix.wrapper }}
          LUA_SUFFIX: ${{ matrix.lua_suffix }}
          ELF_CLASS: ${{ matrix.elf_class }}
          PACKAGE: ${{ matrix.package }}
        run: |
          sdk="$GITHUB_WORKSPACE/.cache/deps/sdk"
          git -C "$sdk" apply "$GITHUB_WORKSPACE/tools/ci/gmod-sdk-posix-memoverride.patch"
          stage="$RUNNER_TEMP/package"
          toolchain=()
          if [[ "$ELF_CLASS" == ELF32 ]]; then
            toolchain=(-DCMAKE_TOOLCHAIN_FILE="$sdk/cmake/linux-x86.cmake")
          fi

          variants=(sse2 sse42 avx2)
          lua_modules=ON
          for variant in "${variants[@]}"; do
            build="$RUNNER_TEMP/build-$variant"
            cmake -S vphysics_jolt -B "$build" -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DVOLT_GMOD_SDK="$sdk/gmod/src" \
              -DGMOD_RUNTIME_ROOT="$RUNNER_TEMP/gmod" -DVOLT_CPU_VARIANT="$variant" \
              -DVOLT_BUILD_LINUX_LUA_MODULES="$lua_modules" "${toolchain[@]}"
            cmake --build "$build" --parallel 2
            cmake --install "$build" --prefix "$stage" --strip
            lua_modules=OFF
          done

          binaries=("$stage/$TARGET_BIN/$WRAPPER")
          for variant in "${variants[@]}"; do
            binaries+=("$stage/$TARGET_BIN/vphysics_jolt_$variant.so")
          done
          for module in gravity constraints softbody; do
            binaries+=("$stage/garrysmod/lua/bin/gmsv_jolt${module}_$LUA_SUFFIX.dll")
          done
          for binary in "${binaries[@]}"; do
            readelf -h "$binary" | awk -v expected="$ELF_CLASS" '$1 == "Class:" && $2 == expected { found = 1 } END { exit !found }' ||
              { echo "Missing or wrong ELF class ($ELF_CLASS): $binary" >&2; exit 1; }
          done

          cp LICENSE "$stage/LICENSE"
          cp -r LICENSES "$stage/LICENSES"
          cp joltphysics/src/LICENSE "$stage/LICENSE-JoltPhysics.txt"
          mkdir -p .cache/ci/downloads
          cd .cache/ci/downloads
          tar -czf "$PACKAGE.tar.gz" -C "$stage" .
          sha256sum "$PACKAGE.tar.gz" > "$PACKAGE.tar.gz.sha256"
      - name: Upload Linux package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}-${{ github.sha }}
          path: .cache/ci/downloads/
          if-no-files-found: error
          retention-days: 30
